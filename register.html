<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — TugasKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <main class="auth-card">
    <div class="brand"><span class="brand-icon">✓</span> TugasKu</div>
    <h1>Buat akun baru</h1>
    <p class="subtitle">Daftar gratis, lalu mulai catat tugasmu.</p>

    <form id="formRegister">
      <label for="nama">Nama lengkap</label>
      <input type="text" id="nama" placeholder="Nama kamu" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="nama@email.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Minimal 6 karakter" minlength="6" required>

      <label for="konfirmasi">Ulangi password</label>
      <input type="password" id="konfirmasi" placeholder="Ketik ulang password" minlength="6" required>

      <p id="pesan" class="pesan-error"></p>

      <button type="submit" class="btn btn-primary btn-block">Daftar</button>
    </form>

    <p class="switch">Sudah punya akun? <a href="index.html">Masuk</a></p>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
