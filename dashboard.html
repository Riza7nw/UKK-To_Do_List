<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — TugasKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="memuat">

  <!-- HEADER -->
  <header class="topbar">
    <div class="brand"><span class="brand-icon">✓</span> TugasKu</div>
    <div class="topbar-kanan">
      <span id="sapaan" class="sapaan">Halo!</span>
      <button id="btnLogout" class="btn btn-ghost">Keluar</button>
    </div>
  </header>

  <main class="container app">

    <!-- RINGKASAN: progres + statistik -->
    <section class="ringkasan">
      <div class="ringkasan-progres">
        <p class="ringkasan-judul">Progres tugasmu</p>
        <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
        <strong id="persenText" class="persen">0%</strong>
      </div>

      <dl class="stats">
        <div class="stat">
          <dt>Total</dt>
          <dd id="statTotal">0</dd>
        </div>
        <div class="stat stat-selesai">
          <dt>Selesai</dt>
          <dd id="statSelesai">0</dd>
        </div>
        <div class="stat stat-belum">
          <dt>Belum selesai</dt>
          <dd id="statBelum">0</dd>
        </div>
        <div class="stat stat-terlambat">
          <dt>Terlambat</dt>
          <dd id="statTerlambat">0</dd>
        </div>
      </dl>
    </section>

    <div class="grid-utama">

      <!-- FORM TAMBAH / EDIT -->
      <section class="card">
        <h2 id="judulForm">Tambah Tugas</h2>
        <form id="formTugas">
          <label for="judul">Judul tugas *</label>
          <input type="text" id="judul" placeholder="Contoh: Kerjakan laporan PKL" maxlength="100" required>

          <label for="deskripsi">Deskripsi</label>
          <textarea id="deskripsi" rows="3" placeholder="Catatan tambahan (opsional)"></textarea>

          <div class="baris-2">
            <div>
              <label for="prioritas">Prioritas</label>
              <select id="prioritas">
                <option value="rendah">Rendah</option>
                <option value="sedang" selected>Sedang</option>
                <option value="tinggi">Tinggi</option>
              </select>
            </div>
            <div>
              <label for="kategori">Kategori</label>
              <select id="kategori">
                <option value="Sekolah">Sekolah</option>
                <option value="Pribadi">Pribadi</option>
                <option value="Kerja">Kerja</option>
                <option value="Lainnya">Lainnya</option>
              </select>
            </div>
          </div>

          <label for="deadline">Deadline</label>
          <input type="date" id="deadline">

          <div class="form-aksi">
            <button type="submit" id="btnSimpan" class="btn btn-primary">+ Tambah Tugas</button>
            <button type="button" id="btnBatal" class="btn btn-ghost tersembunyi">Batal</button>
          </div>
        </form>
      </section>

      <!-- DAFTAR TUGAS -->
      <section class="card">
        <div class="list-header">
          <h2>Daftar Tugas</h2>
          <span id="infoJumlah" class="info-jumlah"></span>
        </div>

        <div class="toolbar">
          <input type="search" id="inputCari" placeholder="🔍 Cari judul tugas...">
          <select id="filterStatus">
            <option value="semua">Semua status</option>
            <option value="belum">Belum selesai</option>
            <option value="selesai">Selesai</option>
            <option value="sampah" id="opsiSampah">🗑 Sampah</option>
          </select>
          <select id="filterKategori">
            <option value="semua">Semua kategori</option>
            <option value="Sekolah">Sekolah</option>
            <option value="Pribadi">Pribadi</option>
            <option value="Kerja">Kerja</option>
            <option value="Lainnya">Lainnya</option>
          </select>
          <select id="urutkan">
            <option value="deadline">Urut: Deadline</option>
            <option value="terbaru">Urut: Terbaru</option>
            <option value="terlama">Urut: Terlama</option>
            <option value="prioritas">Urut: Prioritas</option>
          </select>
        </div>

        <div id="daftarTugas" class="daftar-tugas">
          <p class="kosong">Memuat tugas...</p>
        </div>

        <div id="paginasi" class="paginasi"></div>
      </section>

    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
