<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — TugasKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="memuat">

  <!-- HEADER -->
  <header class="topbar">
    <div class="brand"><span class="brand-icon">✓</span> TugasKu</div>
    <div class="topbar-kanan">
      <span id="sapaan" class="sapaan">Halo!</span>
      <button id="btnLogout" class="btn btn-ghost">Keluar</button>
    </div>
  </header>

  <main class="container app">

    <!-- STATISTIK -->
    <section class="stats">
      <div class="stat-card">
        <span class="stat-label">Total Tugas</span>
        <span id="statTotal" class="stat-angka">0</span>
      </div>
      <div class="stat-card hijau">
        <span class="stat-label">Selesai</span>
        <span id="statSelesai" class="stat-angka">0</span>
      </div>
      <div class="stat-card kuning">
        <span class="stat-label">Belum Selesai</span>
        <span id="statBelum" class="stat-angka">0</span>
      </div>
      <div class="stat-card merah">
        <span class="stat-label">Terlambat</span>
        <span id="statTerlambat" class="stat-angka">0</span>
      </div>
    </section>

    <section class="card progress-card">
      <div class="progress-info">
        <span>Progres penyelesaian</span>
        <strong id="persenText">0%</strong>
      </div>
      <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
    </section>

    <div class="grid-utama">

      <!-- FORM TAMBAH / EDIT -->
      <section class="card">
        <h2 id="judulForm">Tambah Tugas</h2>
        <form id="formTugas">
          <label for="judul">Judul tugas *</label>
          <input type="text" id="judul" placeholder="Contoh: Kerjakan laporan PKL" maxlength="100" required>

          <label for="deskripsi">Deskripsi</label>
          <textarea id="deskripsi" rows="3" placeholder="Catatan tambahan (opsional)"></textarea>

          <div class="baris-2">
            <div>
              <label for="prioritas">Prioritas</label>
              <select id="prioritas">
                <option value="rendah">Rendah</option>
                <option value="sedang" selected>Sedang</option>
                <option value="tinggi">Tinggi</option>
              </select>
            </div>
            <div>
              <label for="kategori">Kategori</label>
              <select id="kategori">
                <option value="Sekolah">Sekolah</option>
                <option value="Pribadi">Pribadi</option>
                <option value="Kerja">Kerja</option>
                <option value="Lainnya">Lainnya</option>
              </select>
            </div>
          </div>

          <label for="deadline">Deadline</label>
          <input type="date" id="deadline">

          <div class="form-aksi">
            <button type="submit" id="btnSimpan" class="btn btn-primary">+ Tambah Tugas</button>
            <button type="button" id="btnBatal" class="btn btn-ghost tersembunyi">Batal</button>
          </div>
        </form>
      </section>

      <!-- DAFTAR TUGAS -->
      <section class="card">
        <div class="list-header">
          <h2>Daftar Tugas</h2>
          <span id="infoJumlah" class="info-jumlah"></span>
        </div>

        <div class="toolbar">
          <input type="search" id="inputCari" placeholder="🔍 Cari judul tugas...">
          <select id="filterStatus">
            <option value="semua">Semua status</option>
            <option value="belum">Belum selesai</option>
            <option value="selesai">Selesai</option>
          </select>
          <select id="filterKategori">
            <option value="semua">Semua kategori</option>
            <option value="Sekolah">Sekolah</option>
            <option value="Pribadi">Pribadi</option>
            <option value="Kerja">Kerja</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>

        <div id="daftarTugas" class="daftar-tugas">
          <p class="kosong">Memuat tugas...</p>
        </div>
      </section>

    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
