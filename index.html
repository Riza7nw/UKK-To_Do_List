<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — TugasKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <main class="auth-card">
    <div class="brand"><span class="brand-icon">✓</span> TugasKu</div>
    <h1>Selamat datang 👋</h1>
    <p class="subtitle">Masuk untuk mengelola tugas-tugasmu.</p>

    <form id="formLogin">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="nama@email.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Minimal 6 karakter" required>

      <button type="button" id="btnLupa" class="link-lupa">Lupa password?</button>

      <p id="pesan" class="pesan-error"></p>

      <button type="submit" class="btn btn-primary btn-block">Masuk</button>
    </form>

    <p class="switch">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
